name: PR Intelligence Guard
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  risk-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blogging Code
        uses: actions/checkout@v4
      - name: Analyze PR Risk
        uses: tejanagach/blast-radius-predictor@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
